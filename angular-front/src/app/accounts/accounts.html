<div class="p-3">
  @if (accounts$ | async; as state) {
    @if (state.status === RequestStatus.ERROR) {
      <div class="alert alert-danger">{{ state.errorMessage }}</div>
    } @else {
      <table class="table">
        <thead>
        <tr>
          <th>ID</th> <th>Balance</th> <th>Date</th> <th>Type</th> <th>CustomerId</th>
        </tr>
        </thead>
        <tbody>
          @for (acc of state.accounts; track acc.id) {
            <tr>
              <td>{{acc.id}}</td>
              <td>{{acc.balance}}</td>
              <td>{{acc.creationAt}}</td>
              <td>{{acc.type}}</td>
              <td>{{acc.customerId}}</td>
            </tr>
          }
        </tbody>
      </table>
    }
  }
</div>
